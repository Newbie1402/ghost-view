services:
  ghostview:
    build: .
    ports:
      - "8080:8080"
    environment:
      ADDR: ":8080"
      WEB_DIR: /app/web
      PROVIDER_MODE: "${PROVIDER_MODE:-live}"
      PROVIDER_TIMEOUT: 8s
      DOWNLOAD_TIMEOUT: 15s
      DOWNLOAD_MAX_BYTES: 26214400
      RATE_LIMIT_PER_MINUTE: 120
      CACHE_MAX_ENTRIES: 1000
      SHUTDOWN_TIMEOUT: 10s
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
